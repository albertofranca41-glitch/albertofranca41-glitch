name: Update GitHub stats card

on:
  push:
    paths:
      - ".github/workflows/update-stats-card.yml"
      - "README.md"
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

concurrency:
  group: update-stats-card
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=dracula&card_width=430
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=5&theme=dracula&card_width=430
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Match top languages card height
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("profile/top-langs.svg")
          svg = path.read_text()
          old = 'width="430"\n        height="165"\n        viewBox="0 0 430 165"'
          new = 'width="430"\n        height="195"\n        viewBox="0 0 430 165"\n        preserveAspectRatio="none"'
          if old not in svg:
              raise SystemExit("Unexpected top-languages SVG dimensions")
          path.write_text(svg.replace(old, new, 1))
          PY

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          git commit -m "Update GitHub profile cards" || exit 0
          git push
